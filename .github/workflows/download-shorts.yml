name: Download Requested YouTube Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/download-shorts.yml"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup yt-dlp and FFmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ffmpeg: true
          aria2: true

      - name: Try yt-dlp first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          failed=0

          for id in X51xe_x5d9I QSFPUmVXv8w QCM2H3T4ooA; do
            if yt-dlp --no-playlist --retries 2 --fragment-retries 2               --merge-output-format mp4               -o "downloads/$id.%(ext)s"               "https://youtube.com/shorts/$id"; then
              echo "yt-dlp downloaded $id"
            else
              echo "yt-dlp failed for $id; Cobalt fallback will handle it."
              failed=1
            fi
          done

          echo "YTDLP_FAILED=$failed" >> "$GITHUB_ENV"

      - name: Start self-hosted Cobalt fallback
        if: env.YTDLP_FAILED == '1'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cobalt             -p 9000:9000             -e API_URL="http://127.0.0.1:9000/"             ghcr.io/imputnet/cobalt:11

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null; then
              echo "Cobalt is ready."
              exit 0
            fi
            sleep 2
          done

          docker logs cobalt
          exit 1

      - name: Download failed items with Cobalt
        if: env.YTDLP_FAILED == '1'
        shell: bash
        run: |
          set -euo pipefail

          for id in X51xe_x5d9I QSFPUmVXv8w QCM2H3T4ooA; do
            if compgen -G "downloads/$id.*" > /dev/null; then
              echo "$id already downloaded by yt-dlp; skipping Cobalt."
              continue
            fi

            response=$(curl -fsS               -H "Accept: application/json"               -H "Content-Type: application/json"               -X POST http://127.0.0.1:9000/               --data "{"url":"https://youtube.com/shorts/$id","videoQuality":"720","youtubeVideoCodec":"h264","youtubeVideoContainer":"mp4","downloadMode":"auto","alwaysProxy":true,"filenameStyle":"basic"}")

            echo "Cobalt response for $id:"
            echo "$response"

            status=$(echo "$response" | jq -r '.status // empty')
            file_url=$(echo "$response" | jq -r '.url // empty')

            if [ "$status" != "tunnel" ] && [ "$status" != "redirect" ]; then
              echo "Cobalt could not produce a downloadable URL for $id."
              exit 1
            fi

            if [ -z "$file_url" ] || [ "$file_url" = "null" ]; then
              echo "Cobalt returned no file URL for $id."
              exit 1
            fi

            curl -fL --retry 3 --retry-delay 2 "$file_url" -o "downloads/$id.mp4"
          done

      - name: Verify all three files
        shell: bash
        run: |
          set -euo pipefail
          for id in X51xe_x5d9I QSFPUmVXv8w QCM2H3T4ooA; do
            test -s "downloads/$id.mp4" || {
              echo "Missing or empty file: $id.mp4"
              exit 1
            }
            ffprobe -v error -show_entries format=duration               -of default=noprint_wrappers=1:nokey=1 "downloads/$id.mp4"
          done

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd downloads
          zip -9 ../three-youtube-shorts.zip ./*.mp4

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: three-youtube-shorts
          path: three-youtube-shorts.zip
          if-no-files-found: error
          retention-days: 7
