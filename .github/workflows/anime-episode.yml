name: ANIMEFORGE episode

on:
  pull_request:
    paths:
      - "anime-studio/**"
      - ".github/workflows/anime-episode.yml"
  workflow_dispatch:
    inputs:
      concept:
        description: Original anime episode concept (blank runs the 10-second engine smoke test)
        required: false
        type: string
      slug:
        description: Project slug (letters, numbers and hyphens)
        required: false
        default: episode
        type: string
      duration_seconds:
        description: Episode duration in seconds (5–1800)
        required: false
        default: "30"
        type: string
      quality:
        description: Horizontal render profile
        required: true
        default: preview
        type: choice
        options:
          - smoke
          - preview
          - master
      publish_release:
        description: Publish MP4 and QA files to a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  anime-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: anime-studio
    env:
      CONCEPT: ${{ inputs.concept }}
      PROJECT_SLUG: ${{ inputs.slug }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      QUALITY: ${{ inputs.quality }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: claude-opus-5-5
      CLAUDE_MAX_BUDGET_USD: "12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: anime-studio/package.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install ANIMEFORGE packages
        run: npm install --no-audit --no-fund

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Run engine tests
        run: npm test

      - name: Generate episode with Claude Agent SDK
        if: ${{ inputs.concept != '' }}
        env:
          CONCEPT: ${{ inputs.concept }}
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::Add ANTHROPIC_API_KEY to repository Actions secrets before requesting Claude generation."
            exit 1
          fi
          SAFE_SLUG="$(printf '%s' "$PROJECT_SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-48)"
          [[ -n "$SAFE_SLUG" ]] || SAFE_SLUG="episode-$GITHUB_RUN_NUMBER"
          node src/agent.mjs "$CONCEPT" --slug "$SAFE_SLUG" --duration "$DURATION_SECONDS" --quality "$QUALITY"
          node src/render.mjs --project "projects/$SAFE_SLUG/episode.json" --quality "$QUALITY" --output "out/$SAFE_SLUG.mp4"

      - name: Render the built-in engine smoke scene
        if: ${{ inputs.concept == '' }}
        run: |
          mkdir -p out
          node src/render.mjs --project projects/demo/episode.json --quality smoke --output out/animeforge-smoke.mp4

      - name: Publish MP4 and QA files as a GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$CONCEPT" ]]; then
            SAFE_SLUG="$(printf '%s' "$PROJECT_SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-48)"
            [[ -n "$SAFE_SLUG" ]] || SAFE_SLUG="episode-$GITHUB_RUN_NUMBER"
          else
            SAFE_SLUG="animeforge-smoke"
          fi
          gh release create "animeforge-$GITHUB_RUN_NUMBER" \
            "out/$SAFE_SLUG.mp4" \
            "out/$SAFE_SLUG.qa.json" \
            "out/$SAFE_SLUG.contact-sheet.png" \
            --title "ANIMEFORGE episode $GITHUB_RUN_NUMBER" \
            --notes "Horizontal 16:9 Three.js 2.5D render with frame QA. Original scripts and assets remain in SHORTFORGE."
