name: SHORTFORGE render

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Render profile
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - preview
          - master
      enable_kokoro:
        description: Generate narration from narration_text in project config
        type: boolean
        required: true
        default: false
      publish_release:
        description: Publish MP4 and compact QA files as a GitHub Release
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: shortforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "4.5"
      BLENDER_USER_CONFIG: ${{ runner.temp }}/blender-config
      XDG_CACHE_HOME: ${{ runner.temp }}/cache
      QUALITY: ${{ inputs.quality }}
      ENABLE_KOKORO: ${{ inputs.enable_kokoro }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Blender, FFmpeg and QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-pil libgl1-mesa-dri libegl1
          blender --version | head -n 2
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Build Three.js previs
        working-directory: preview
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare selected project profile
        run: |
          mkdir -p "$RUNNER_TEMP/shortforge" out
          python3 scripts/prepare_project.py --quality "$QUALITY" --output "$RUNNER_TEMP/shortforge/project.json"
          python3 scripts/validate_project.py "$RUNNER_TEMP/shortforge/project.json"

      - name: Install optional Kokoro dependencies
        if: env.ENABLE_KOKORO == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/shortforge/tts-venv"
          "$RUNNER_TEMP/shortforge/tts-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/shortforge/tts-venv/bin/pip" install -r requirements-tts.txt

      - name: Generate optional Kokoro narration
        if: env.ENABLE_KOKORO == 'true'
        run: |
          "$RUNNER_TEMP/shortforge/tts-venv/bin/python" src/audio/generate_kokoro.py \
            --project "$RUNNER_TEMP/shortforge/project.json" \
            --voice "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("kokoro_voice", "am_michael"))' "$RUNNER_TEMP/shortforge/project.json")" \
            --output "$RUNNER_TEMP/shortforge/voice.wav"
          python3 - "$RUNNER_TEMP/shortforge/project.json" "$RUNNER_TEMP/shortforge/voice.wav" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); p['narration_file']=sys.argv[2]
          json.dump(p,open(sys.argv[1],'w'),indent=2)
          PY

      - name: Render, analyze every frame and encode MP4
        run: |
          python3 scripts/render.py \
            --project "$RUNNER_TEMP/shortforge/project.json" \
            --output-dir out/render

      - name: Publish MP4 and QA outputs as a GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shortforge-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            out/render/shortforge.mp4 \
            out/render/qa-report.json \
            out/render/contact-sheet.jpg \
            out/render/render-manifest.json \
            --title "SHORTFORGE render ${GITHUB_RUN_NUMBER}" \
            --notes "Blender native render, FFmpeg H.264, 30 fps. Frame QA and ffprobe verification passed. No Actions artifact upload was used."
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write render summary
        if: always()
        run: |
          {
            echo "## SHORTFORGE render"
            echo "- Profile: ${QUALITY}"
            echo "- Renderer: Blender headless; no Remotion or Chromium"
            echo "- Encoder: FFmpeg H.264 at 30 fps"
            echo "- Storage: GitHub Release assets only; no Actions artifacts"
            if [ -f out/render/render-manifest.json ]; then
              echo '### Render manifest'
              cat out/render/render-manifest.json
            fi
            if [ -f out/render/qa-report.json ]; then
              echo '### Frame QA'
              cat out/render/qa-report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
