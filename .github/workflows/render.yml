name: SHORTFORGE render preflight

on:
  push:
    branches:
      - main
    paths:
      - production/launch-short.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate SHORTFORGE source and project config
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: python3 --version

      - name: Compile project entry points
        run: |
          python3 -m py_compile \
            scripts/prepare_project.py \
            scripts/render.py \
            scripts/fetch_assets.py \
            src/blender/render_scene.py \
            src/blender/avatar_system.py \
            src/qa/analyze_frames.py

      - name: Validate original short config
        run: python3 scripts/validate_project.py production/launch-short.json
