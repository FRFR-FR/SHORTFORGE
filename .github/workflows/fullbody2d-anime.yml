name: FULLBODY2D — fully rendered anime characters on a 2D stage

on:
  push:
    branches:
      - feature/animeforge-2-5d-agent
    paths:
      - "anime-studio/fullbody2d/**"
      - ".github/workflows/fullbody2d-anime.yml"
      - "anime-studio/README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fullbody2d:
    name: Download licensed visual references, render 2D art, encode and QA
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FPS: "30"
      SECONDS: "6"
      WIDTH: "1280"
      HEIGHT: "720"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno JavaScript runtime for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.1

      - name: Install 2D rendering dependencies and yt-dlp with EJS support
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv libcairo2
          python3 -m venv "$RUNNER_TEMP/fullbody-venv"
          "$RUNNER_TEMP/fullbody-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/fullbody-venv/bin/python" -m pip install cairosvg pillow yt-dlp
          ffmpeg -version | head -n 1
          deno --version
          "$RUNNER_TEMP/fullbody-venv/bin/python" -m yt_dlp --version

      - name: Download creator-licensed Morevna visual references with yt-dlp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visual-reference"
          "$RUNNER_TEMP/fullbody-venv/bin/python" anime-studio/fullbody2d/download_references.py \
            --output-dir "$RUNNER_TEMP/visual-reference"
          # The downloads and contact sheets are temporary research material.
          # They are never added to the repository or finished episode.
          for source in morevna-demo morevna-episode-3; do
            VIDEO="$(find "$RUNNER_TEMP/visual-reference/$source" -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mkv' -o -name '*.webm' -o -name '*.mov' \) -print -quit)"
            test -n "$VIDEO"
            ffmpeg -hide_banner -loglevel error -y -i "$VIDEO" \
              -vf "fps=1/8,scale=420:-1,tile=2x2" -frames:v 1 \
              "$RUNNER_TEMP/visual-reference/$source-contact-sheet.png"
          done

      - name: Render two fully coloured 2D human characters and designed props
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fullbody2d-output"
          "$RUNNER_TEMP/fullbody-venv/bin/python" anime-studio/fullbody2d/render.py \
            --output-dir "$RUNNER_TEMP/fullbody2d-output"
          test -s "$RUNNER_TEMP/fullbody2d-output/fullbody2d-scene.svg"
          test -s "$RUNNER_TEMP/fullbody2d-output/fullbody2d-manifest.json"

      - name: Encode 720p H.264 review master
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -y \
            -framerate "$FPS" -start_number 1 \
            -i "$RUNNER_TEMP/fullbody2d-output/frames/frame_%04d.png" \
            -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -r "$FPS" \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 \
            -movflags +faststart -an \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-review-720p.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate,nb_read_frames \
            -show_entries format=duration,size -of json \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-review-720p.mp4"

      - name: Contact sheet and full-body 2D QA
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -y \
            -i "$RUNNER_TEMP/fullbody2d-output/fullbody2d-review-720p.mp4" \
            -vf "fps=1,scale=480:-1,tile=3x2" -frames:v 1 \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-contact-sheet.png"
          "$RUNNER_TEMP/fullbody-venv/bin/python" anime-studio/fullbody2d/qa.py \
            --video "$RUNNER_TEMP/fullbody2d-output/fullbody2d-review-720p.mp4" \
            --frames-dir "$RUNNER_TEMP/fullbody2d-output/frames" \
            --manifest "$RUNNER_TEMP/fullbody2d-output/fullbody2d-manifest.json" \
            --report "$RUNNER_TEMP/fullbody2d-output/fullbody2d-qa.json"

      - name: Publish the original 2D review sample
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fullbody2d-review-720p-\${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-review-720p.mp4" \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-scene.svg" \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-contact-sheet.png" \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-manifest.json" \
            "$RUNNER_TEMP/fullbody2d-output/fullbody2d-qa.json" \
            --target "$GITHUB_SHA" \
            --title "FULLBODY2D — rendered 2D character test #\${GITHUB_RUN_NUMBER}" \
            --notes "Original full-colour 2D characters and designed props on a 2D stage. 6 seconds, 1280x720, 30fps, no audio. Licensed Morevna visual references were downloaded video-only to temporary CI storage and are not included in the episode. Attribution is documented in the repository guide." \
            --prerelease
