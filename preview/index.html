<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111821" />
    <title>SHORTFORGE — Three.js Previs</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <p class="eyebrow">SHORTFORGE / PREVIS</p>
          <h1>Vertical scene preview</h1>
          <p class="subhead">Block the shot and inspect the 9:16 composition before the Blender render.</p>
        </div>
        <div class="status"><span class="dot"></span> 30 FPS target · 9:16</div>
      </header>
      <section class="stage-wrap">
        <div id="stage" aria-label="Interactive 3D animated short preview"></div>
        <div class="controls">
          <button id="play">Pause</button>
          <button id="restart" class="secondary">Restart</button>
          <label>Camera distance <input id="distance" type="range" min="9" max="18" step="0.1" value="13.2" /></label>
          <label>Character travel <input id="travel" type="range" min="0" max="1.4" step="0.05" value="0.45" /></label>
        </div>
      </section>
      <footer>Previs only — final frames are rendered headlessly by Blender and encoded by FFmpeg.</footer>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
